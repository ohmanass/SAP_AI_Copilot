# Continuous integration: every push and pull request runs the offline tests of the
# backend and the UI5 linter of the frontend. No secret is needed: the tests simulate
# SAP S/4HANA, SAP AI Core and the database (see tests/conftest.py).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push of the same branch cancels the run still in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"        # same as SAP BTP (deploy.ps1: runtime.txt)
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q

  frontend:
    name: Frontend (UI5 linter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the UI5 tooling
        run: npm ci

      - name: Lint the SAPUI5 code
        run: npx ui5lint
