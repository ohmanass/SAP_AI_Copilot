<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#070d1a">
	<title>SAP AI Copilot</title>
	<!-- Shown by the service worker (sw.js) when the app cannot be reached: self-contained, no SAPUI5 -->
	<style>
		html, body { height: 100%; margin: 0; }
		body {
			display: grid;
			place-items: center;
			padding: 1.5rem;
			box-sizing: border-box;
			background: radial-gradient(circle at 50% 0%, #10203d 0%, #070d1a 60%);
			color: #e2e8f0;
			font-family: "72", "Segoe UI", system-ui, sans-serif;
			text-align: center;
		}
		main { max-width: 26rem; }
		img { width: 4rem; height: 4rem; }
		h1 { margin: 1.25rem 0 0.5rem; font-size: 1.375rem; }
		p { margin: 0 0 1.5rem; line-height: 1.55; color: #94a3b8; }
		button {
			padding: 0.625rem 1.5rem;
			border: 0;
			border-radius: 999px;
			background: linear-gradient(90deg, #3b82f6, #22d3ee);
			color: #04101f;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<main>
		<img src="img/logo.svg" alt="">
		<h1 id="title">You are offline</h1>
		<p id="text">SAP AI Copilot needs a connection to reach SAP and the AI model. Check your network, then try again.</p>
		<button id="retry" type="button">Try again</button>
	</main>
	<script src="offline.js"></script>
</body>
</html>
