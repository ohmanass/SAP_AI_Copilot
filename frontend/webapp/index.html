<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#070d1a">
	<title>SAP AI Copilot</title>
	<link rel="icon" href="img/logo.svg" type="image/svg+xml">
	<!-- Installable app (PWA): manifest, icons, iOS home screen -->
	<link rel="manifest" href="app.webmanifest">
	<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="AI Copilot">
	<style>
		html, body, #content, #content > div { height: 100%; margin: 0; background: #070d1a; }
	</style>
	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.136.24/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon_dark"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-on-init="module:com/sapaicopilot/app/boot"
		data-sap-ui-resource-roots='{ "com.sapaicopilot.app": "./" }'
		data-sap-ui-frame-options="trusted">
	</script>
</head>
<body class="sapUiBody cpBody" id="content">
	<div
		data-sap-ui-component
		data-name="com.sapaicopilot.app"
		data-id="container"
		data-settings='{ "id": "copilot" }'
		data-height="100%">
	</div>
</body>
</html>
