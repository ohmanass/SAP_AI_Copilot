specVersion: "4.0"
metadata:
  name: com.sapaicopilot.app
type: application
framework:
  name: SAPUI5
  version: "1.136.24"
  libraries:
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  settings:
    httpPort: 8080
  customMiddleware:
    # Forwards /api/* to the local FastAPI backend (the approuter does this on SAP BTP)
    - name: copilot-api-proxy
      beforeMiddleware: compression
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: copilot-api-proxy
middleware:
  path: lib/apiProxy.js
