# Cloud Foundry manifest for SAP AI Copilot.
# Used by deploy/deploy.ps1, which builds the "build/" folder first and
# provides the variables ((genai_model)) and ((backend_host)).
---
applications:

  # FastAPI backend: every /api call (except /api/health) requires a valid
  # XSUAA token, which the approuter forwards for the signed-in user.
  - name: sap-ai-copilot-backend
    path: build/backend
    buildpacks:
      - python_buildpack
    stack: cflinuxfs5
    memory: 1G
    disk_quota: 3G
    instances: 1
    command: python -m uvicorn app.api:app --host 0.0.0.0 --port $PORT
    routes:
      - route: ((backend_host)).cfapps.eu10-005.hana.ondemand.com
    health-check-type: http
    health-check-http-endpoint: /api/health
    timeout: 180
    env:
      SAP_DATA_SOURCE: odata
      GENAI_MODEL_NAME: ((genai_model))
    services:
      - sap-ai-copilot-xsuaa
      - sap-ai-copilot-aicore
      - sap-ai-copilot-s4

  # Application Router: public URL, SAP login (XSUAA), serves the SAPUI5 app, proxies /api
  - name: sap-ai-copilot-approuter
    path: build/approuter
    buildpacks:
      - nodejs_buildpack
    stack: cflinuxfs5
    memory: 256M
    disk_quota: 512M
    instances: 1
    random-route: true
    services:
      - sap-ai-copilot-xsuaa
    env:
      SESSION_TIMEOUT: 30
      destinations: >
        [{
          "name": "copilot-backend",
          "url": "https://((backend_host)).cfapps.eu10-005.hana.ondemand.com",
          "forwardAuthToken": true,
          "timeout": 300000
        }]
